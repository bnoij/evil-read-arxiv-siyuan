# evil-read-arxiv Kimi + SiYuan + Zotero configuration example
# Copy this file to config.yaml. Keep credentials out of this file.

# Language setting: "zh" for Chinese reports, "en" for English reports
language: "en"

# SiYuan HTTP API. Set SIYUAN_API_TOKEN in the environment instead of writing a token here.
siyuan:
  base_url: "http://127.0.0.1:6806"
  assets_dir: "/assets/"
  daily_root: "/Research/Daily"
  graph_path: "/Research/PaperGraph"
  job_timeout: 900

recommendation:
  top_n: 10
  deep_analysis_count: 3
  recent_days: 30
  hot_days: 365

# The destination notebook and Zotero root are configured in siyuan-plugin-zotero-notes 0.2.0.

# Research interests configuration (required)
research_domains:
  # Domain names can be customized freely
  "Computational Pathology":
    # Keywords for searching and matching papers
    keywords:
      - "pathology"
      - "histopathology"
      - "whole slide image"
      - "WSI"
      - "digital pathology"
      - "computational pathology"
      - "tissue classification"
      - "tumor detection"
      - "cancer grading"
      - "survival prediction"
      - "multiple instance learning"
      - "MIL"
      - "slide-level"
      - "patch-level"
      - "nuclei segmentation"
      - "stain normalization"
      - "H&E"
      - "immunohistochemistry"
      - "biomarker prediction"
      - "spatial"
      - "spatial transcriptomics"
    # arXiv categories (optional)
    arxiv_categories:
      - "cs.CV"
      - "eess.IV"
      - "cs.AI"
      - "cs.LG"
      - "q-bio.QM"
    # Priority (optional, 1-10, higher = higher priority)
    priority: 5

